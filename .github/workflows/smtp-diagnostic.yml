name: SMTP diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify SMTP and send test message
        env:
          SMTP_HOST: ${{ secrets.PILDORAS_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.PILDORAS_SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.PILDORAS_SMTP_SECURE }}
          SMTP_USER: ${{ secrets.PILDORAS_SMTP_USER }}
          SMTP_PASS: ${{ secrets.PILDORAS_SMTP_PASS }}
          MAIL_FROM: ${{ secrets.PILDORAS_MAIL_FROM }}
        run: |
          node --input-type=module <<'NODE'
          import nodemailer from 'nodemailer';
          const transport = nodemailer.createTransport({
            host: process.env.SMTP_HOST,
            port: Number(process.env.SMTP_PORT || 587),
            secure: process.env.SMTP_SECURE === 'true',
            connectionTimeout: 10000,
            greetingTimeout: 10000,
            socketTimeout: 15000,
            auth: { user: process.env.SMTP_USER, pass: process.env.SMTP_PASS }
          });
          await transport.verify();
          const result = await transport.sendMail({
            from: process.env.MAIL_FROM || process.env.SMTP_USER,
            to: 'gbailly@alcaste-lasfuentes.com',
            subject: '[Píldoras] Prueba SMTP',
            text: 'Prueba de configuración SMTP de Píldoras de Innovación.'
          });
          console.log(`SMTP_OK ${result.messageId}`);
          NODE
