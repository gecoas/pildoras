name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  quality:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to production
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Connect to production network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.PROD_HOST }}

      - name: Deploy by SSH
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077

          : "${PROD_HOST:?Falta la variable PROD_HOST}"
          : "${PROD_USER:?Falta la variable PROD_USER}"
          : "${PROD_SSH_KEY:?Falta el secreto PROD_SSH_KEY}"
          : "${GITHUB_SHA:?Falta GITHUB_SHA}"

          if [[ "$PROD_HOST" != "100.86.174.92" ]]; then
            echo "PROD_HOST no coincide con el servidor Tailscale esperado" >&2
            exit 1
          fi
          if [[ "$PROD_USER" != "deploy" ]]; then
            echo "PROD_USER no coincide con el usuario de despliegue esperado" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA no tiene formato de commit valido" >&2
            exit 1
          fi

          KNOWN_HOSTS="$GITHUB_WORKSPACE/.github/production_known_hosts"
          SSH_KEY="$(mktemp)"
          cleanup() { rm -f -- "$SSH_KEY"; }
          trap cleanup EXIT

          test -r "$KNOWN_HOSTS" || { echo "Falta la clave de host versionada" >&2; exit 1; }
          ssh-keygen -F "$PROD_HOST" -f "$KNOWN_HOSTS" >/dev/null 2>&1 || {
            echo "No se encontro la clave de host de produccion" >&2
            exit 1
          }

          printf '%s\n' "$PROD_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"
          ssh-keygen -y -P '' -f "$SSH_KEY" >/dev/null 2>&1 || {
            echo "PROD_SSH_KEY no es una clave privada SSH valida sin passphrase" >&2
            exit 1
          }

          SSH_OPTIONS=(
            -F /dev/null
            -i "$SSH_KEY"
            -o "Port=22"
            -o "StrictHostKeyChecking=yes"
            -o "UserKnownHostsFile=$KNOWN_HOSTS"
            -o "GlobalKnownHostsFile=/dev/null"
            -o "IdentitiesOnly=yes"
            -o "BatchMode=yes"
            -o "PasswordAuthentication=no"
            -o "KbdInteractiveAuthentication=no"
            -o "PubkeyAuthentication=yes"
            -o "ForwardAgent=no"
            -o "ClearAllForwardings=yes"
            -o "UpdateHostKeys=no"
            -o "HostKeyAlgorithms=ssh-ed25519"
            -o "ConnectTimeout=10"
          )

          ssh -T "${SSH_OPTIONS[@]}" "$PROD_USER@$PROD_HOST" true

          REMOTE_COMMAND="GITHUB_SHA='$GITHUB_SHA' flock -w 120 /tmp/pildoras-deploy.lock bash -s"
          ssh "${SSH_OPTIONS[@]}" "$PROD_USER@$PROD_HOST" "$REMOTE_COMMAND" <<'REMOTE'
            set -euo pipefail

            PROD_PATH="/opt/proyectos/pildoras"
            REPO_SSH="git@github-gecoas-prod:gecoas/pildoras.git"

            mkdir -p "$PROD_PATH"
            cd "$PROD_PATH"

            if [[ ! -d .git ]]; then
              git init --quiet
            fi
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$REPO_SSH"
            else
              git remote add origin "$REPO_SSH"
            fi

            git fetch --quiet origin "$GITHUB_SHA"
            git checkout --detach --force "$GITHUB_SHA"
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
            git clean -fd

            npm ci
            npm run build
            test -f dist/index.html
            echo "Deploy completado correctamente para $GITHUB_SHA"
          REMOTE
